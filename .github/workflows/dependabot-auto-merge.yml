name: Dependabot review

# Rollout policy: review updates manually after every required check passes.
# This replaces the workflow that enabled automatic merging.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  review-policy:
    name: Dependency review policy
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Record review policy
        run: echo 'Review dependency changes and the preview after Lint, Type Check, Test, E2E Tests, and Build pass. This workflow does not enable auto-merge.' >> "$GITHUB_STEP_SUMMARY"
